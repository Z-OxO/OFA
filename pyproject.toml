[project]
name = "ofa"
version = "0.1.0"
description = "OpenFront Analyzer : collecte, re-simulation et analyse des parties publiques d'OpenFront"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "zstandard>=0.23"]

[project.scripts]
ofa = "ofa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ofa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests longs (re-simulation de vraies parties)",
  "network: tests qui appellent l'API OpenFront",
]

[tool.ruff]
line-length = 100
# Hors perimetre : skills fournies, donnees, scripts jetables du J0.
extend-exclude = [".claude", "data", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
